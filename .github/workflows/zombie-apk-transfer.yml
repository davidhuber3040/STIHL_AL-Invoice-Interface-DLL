name: Zombie APK Transfer

on:
  push:
    branches: [ tmp-zombie-apk-transfer ]
    paths: [ '.github/workflows/zombie-apk-transfer.yml' ]

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Zombie APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output ZombieDefense-Deluxe-v2.0.apk 'https://release-assets.githubusercontent.com/github-production-release-asset/1341574505/819c7286-c8c7-403a-a20e-b5effb9b60fa?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-12T18%3A08%3A50Z&rscd=attachment%3B+filename%3DZombieDefense-Deluxe-v2.0.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-12T17%3A08%3A04Z&ske=2026-09-12T18%3A08%3A50Z&sks=b&skv=2018-11-09&sig=K2hSPUBw4T5n%2FvSbFSlyKRkwBIMCQr6Nsn7IYaYOxco%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4OTIzNDU3NCwibmJmIjoxNzg5MjM0Mjc0LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.5l5GPWvVR0Bvla7lsT9iyCP6MYtGv75QjHOg2DYNXY4&response-content-disposition=attachment%3B%20filename%3DZombieDefense-Deluxe-v2.0.apk&response-content-type=application%2Fvnd.android.package-archive'
          test -s ZombieDefense-Deluxe-v2.0.apk
          SHA="$(sha256sum ZombieDefense-Deluxe-v2.0.apk | awk '{print $1}')"
          test "$SHA" = "354cdbc2ed450c0a7517bd8a6dd10751ba71461a9b91be47f4c34a0da45ff63b"
          echo "Verified SHA256=$SHA"

      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="zombie-defense-deluxe-v2.0-chat-transfer"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" ZombieDefense-Deluxe-v2.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Zombie Defense Deluxe v2.0 APK" --notes "Temporary transfer release. SHA-256: 354cdbc2ed450c0a7517bd8a6dd10751ba71461a9b91be47f4c34a0da45ff63b"
